cross_modal_anomaly_detection:
  ros__parameters:
    projected_points_topic: '/cross_modal/lidar_projected_points'
    estimated_points_topic: '/cross_modal/lidar_expected_projection'
    depth_topic: '/depth_anything/depth'
    valid_mask_topic: '/rgb_rectification/valid_mask'
    require_valid_mask: true
    mode: 'relative'
    profile_support_filter_enabled: true
    profile_max_interp_gap_px: 6.0
    profile_narrow_object_width_px: 10.0
    profile_narrow_object_jump_iqr: 0.7
    profile_narrow_object_margin_px: 3.0
    spatial_irregularity_enabled: true
    spatial_irregularity_vote_enabled: true
    spatial_irregularity_regions: 7
    spatial_irregularity_overlap_fraction: 0.2
    spatial_irregularity_min_unique_points: 8
    spatial_irregularity_neighborhood: 7
    spatial_irregularity_threshold: 0.2
    spatial_irregularity_min_fraction: 0.08
    spatial_irregularity_min_bad_regions: 2
    spatial_irregularity_min_fit_samples: 45
    spatial_irregularity_max_cached_fit_scans: 2
    spatial_irregularity_cached_fit_min_pairs: 24
    spatial_irregularity_cached_fit_max_median_residual: 0.35
    spatial_irregularity_max_neighbor_gap_px: 16.0
    spatial_irregularity_alignment_smooth_sigma: 12.0
    spatial_irregularity_skip_rotation: true
    spatial_irregularity_moving_multiplier: 1.05
    local_ncc_fusion_enabled: true
    local_ncc_regions: 9
    local_ncc_overlap_fraction: 0.5
    local_ncc_require_adjacent_pair: true
    local_ncc_focus_gain: 1.6
    local_ncc_min_corr_drop: 0.23
    local_ncc_residual_enabled: true
    local_ncc_min_region_coverage: 0.75
    local_ncc_min_region_points: 30
    local_ncc_residual_min_median: 0.55
    local_ncc_residual_min_excess: 0.23
    local_ncc_rotation_guard_enabled: true
    local_ncc_rotation_hold_s: 0.75
    local_ncc_rotation_focus_gain: 1.0
    local_ncc_rotation_min_corr_drop: 0.3
    local_ncc_rotation_min_region_coverage: 0.85
    local_ncc_rotation_min_region_points: 45
    local_ncc_rotation_residual_min_median: 0.7
    local_ncc_rotation_residual_min_excess: 0.3
    local_ncc_rotation_min_affected_regions: 2
    similarity_threshold: 0.6
    motion_similarity_threshold: 0.6
    rotation_similarity_threshold: 0.5
    x_sampling_step_px: 1
    spatial_smoothing_window: 7
    temporal_smoothing_enabled: true
    temporal_smoothing_alpha: 0.15
    edge_fraction: 0.05
    use_person_roi_weighting: false
    anomaly_window: 20
    required_bad_frames: 12
    vote_weak_confirm_window: 4
    vote_weak_confirm_required: 3
    required_consecutive_bad_scans: 2
    minimum_bad_evidence_duration_s: 0.25
    moving_required_consecutive_bad_scans: 2
    moving_minimum_bad_evidence_duration_s: 0.5
    dropout_vote_interval_s: 0.25
    shift_max_px: 3
    shift_min_overlap_ratio: 0.9
    shift_min_gain: 0.01
    motion_aware_enabled: true
    odom_topic: '/odom'
    motion_linear_threshold_mps: 0.035
    motion_angular_threshold_radps: 0.1
    motion_hold_s: 0.75
    coverage_global_ratio: 0.5
    coverage_region_ratio: 0.25
    coverage_required_regions: 2
    min_paired_coverage: 0.25
    coverage_region_votes_enabled: true
    return_coverage_static_ratio: 0.65
    return_coverage_moving_ratio: 0.55
    motion_coverage_global_ratio: 0.4
    motion_coverage_region_ratio: 0.25
    motion_coverage_required_regions: 2
    peak_mismatch_enabled: false
    peak_residual_threshold: 0.85
    motion_peak_residual_threshold: 1.1
    rotation_peak_residual_threshold: 1.25
    peak_min_fraction: 0.35
    motion_peak_min_fraction: 0.25
    rotation_peak_min_fraction: 0.35
    peak_min_run_px: 22
    peak_max_motion_projection_dt_s: 0.15
    rgb_depth_invalid_alarm_enabled: true
    rgb_depth_min_valid_fraction: 0.1
    rgb_depth_min_std: 1e-05
    rgb_flat_lidar_min_cv: 0.08
    return_coverage_scan_topic: '/scan'
    status_topic: '/cross_modal_anomaly/status'
    anomaly_topic: '/cross_modal_anomaly/anomaly'
    frame_bad_topic: '/cross_modal_anomaly/frame_bad'
    similarity_topic: '/cross_modal_anomaly/shape_similarity'
    profile_plot_topic: '/cross_modal_anomaly/profile_plot'
    slope_plot_topic: '/cross_modal_anomaly/slope_plot'
    curvature_plot_topic: '/cross_modal_anomaly/curvature_plot'
